<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Scan</title><style>
body{margin:0;background:#080a0f;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{width:min(700px,90%);background:#111620;border:1px solid #303847;border-radius:18px;padding:28px;box-shadow:0 15px 50px #0009}h1{margin:0 0 12px}.bar{height:10px;background:#252c38;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:#fff;transition:width 2.2s}.status{margin:15px 0;font-size:18px}.rows{display:none}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #252b36}.final{display:none;margin-top:22px;padding:18px;border-radius:12px;background:#182318;border:1px solid #334b33;font-size:20px}.note{color:#9da7b8;font-size:13px;margin-top:15px}</style></head><body>
<div class="card"><h1>🔐 جاري فحص الجهاز...</h1><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">جاري الاتصال بالنظام...</div>
<div class="rows" id="rows">
<div class="row"><span>الاسم</span><b>ناصر</b></div><div class="row"><span>الدولة</span><b>السعودية 🇸🇦</b></div><div class="row"><span>المنطقة</span><b>الرياض</b></div><div class="row"><span>العمر</span><b>13 سنة</b></div><div class="row"><span>الجهاز</span><b>PC 🖥️</b></div><div class="row"><span>النظام</span><b>Windows</b></div><div class="row"><span>المتصفح</span><b>Chrome</b></div><div class="row"><span>مستوى الخطر</span><b>99% 😂</b></div></div>
<div class="final" id="final">⚠️ اكتمل الفحص بنجاح<br><small>تم تحليل البيانات المعروضة.</small></div><div class="note">نظام الفحص: لا يتم جمع أو إرسال أي بيانات من الجهاز.</div></div>
<script>setTimeout(()=>document.getElementById('fill').style.width='100%',100);setTimeout(()=>{document.getElementById('status').textContent='✅ اكتمل الفحص — تم العثور على البيانات';document.getElementById('rows').style.display='block'},2300);setTimeout(()=>document.getElementById('final').style.display='block',3500);</script></body></html>
